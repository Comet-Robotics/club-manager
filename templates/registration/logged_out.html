{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out | {{ settings.organization_name }}</title>
    <link rel="stylesheet" href="{% static 'core/styles.css' %}">
    <style>
        :root {
            --primary: {{ settings.accent_color_hex }};
        }
    </style>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.475.0"></script>
</head>
<body style="background-color: var(--white); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <main class="main-content" style="max-width: 384px; width: 100%; padding: 0;">
        <div style="background-color: var(--white); width: 100%; text-align: center; padding: 3rem 2rem;">
            <!-- Brand Lockup -->
            <div style="display: flex; align-items: center; padding-bottom: 40px; gap: 12px; justify-content: center;">
                <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; border-radius: 8px; background-color: var(--primary);">
                    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="13" cy="13" r="10.5625" stroke="white" stroke-width="2"/>
                        <path d="M7.312 5.688L13 13.562L18.688 5.688" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span style="font-size: 16px; line-height: 24px; font-family: system-ui, sans-serif; font-weight: 600; color: var(--gray-900);">{{ settings.organization_name }}</span>
            </div>

            <h1 style="font-size: 32px; letter-spacing: -0.02em; line-height: 40px; font-family: system-ui, sans-serif; font-weight: 600; color: var(--gray-900); margin: 0 0 16px;">You've been logged out</h1>
            <p style="font-size: 14px; line-height: 21px; font-family: system-ui, sans-serif; font-weight: 400; color: var(--gray-500); margin: 0 0 32px;">Your session has ended. You can sign in again to continue.</p>

            <a href="{% url 'login' %}" style="display: inline-flex; align-items: center; justify-content: center; height: 44px; border-radius: 6px; background-color: var(--primary); color: var(--white); font-size: 14px; line-height: 21px; font-family: system-ui, sans-serif; font-weight: 600; border: none; cursor: pointer; padding: 0 24px; text-decoration: none; transition: background-color 0.15s;">
                Sign in again
            </a>

            <div style="display: flex; flex-direction: column; padding-top: 28px; gap: 16px; width: 100%;">
                <div style="height: 1px; background-color: var(--gray-200);"></div>
                <p style="font-size: 13px; line-height: 20px; text-align: center; font-family: system-ui, sans-serif; font-weight: 400; color: var(--gray-500); margin: 0;">
                    Trouble signing in? Reach out to a club officer on Discord.
                </p>
            </div>
        </div>
    </main>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
