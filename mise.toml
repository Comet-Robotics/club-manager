[settings]
idiomatic_version_file_enable_tools = ["python"] # tells mise to look at .python-version to know what version of python to install. useful because we previously recommended pyenv for installing python, which looks at that file to determine what python version to use. this way we don't need to force people off of pyenv yet

[tools]
uv = "0.12.17" # bootstrap only, NOT a project dependency: mise's pypi: backend needs uv to install pipenv. uv rather than pipx because mise resolves pipx through aqua, which has no Windows builds
"pypi:pipenv" = { version = "2026.8.0", depends = ["uv"] }
gh = "2.102.0" # GitHub CLI - used for Git authentication (gh auth login) and everyday PR workflows

[tasks.server]
description = "Run the Django dev server"
run = "pipenv run python manage.py runserver"

[tasks.bot]
description = "Run the Discord bot"
run = "pipenv run python discord_bot.py"

[tasks.manage]
description = "Run any Django management command, e.g. `mise run manage -- migrate`"
run = "pipenv run python manage.py"

[tasks.new-developer-setup]
description = "First-time dev setup: install deps, GitHub login, create .env, migrate, create cache table, create default superuser (safe to re-run)"
# --python is required: without it pipenv builds the virtualenv from whatever
# interpreter pipenv itself runs under, which is not the version we pin. Pin by
# exact version (resolved from .python-version) rather than by name or PATH,
# since pipenv does not reliably pick the first `python` it finds.
run = [
  "pipenv install --dev --python {{ tools.python.version }}",
  "pipenv run python scripts/dev_setup.py",
]
