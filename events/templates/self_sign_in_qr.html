{% extends "newBase.html" %}
{% load static %}
{% block title %}Self Sign-In QR - {{ event.event_name }}{% endblock %}

{% block content %}
<main class="main-content">
  <section>
    <h2 class="section-title">Self Sign-In QR Code</h2>
    <a href="{% url 'event_overview' event_id=event.id %}" class="sign-in-button signin-qr-back">Back</a>

    <div class="event-card signin-qr-card">
      <div class="signin-qr-body">
        <div class="signin-qr-side">
          <div class="signin-qr-colors">
            <div class="signin-qr-color">
              <label for="qr-foreground">QR code color</label>
              <select id="qr-foreground">
                <option value="black">Black</option>
                <option value="white">White</option>
                <option value="brand">Accent color</option>
                <option value="transparent">Transparent</option>
              </select>
            </div>
            <div class="signin-qr-color">
              <label for="qr-background">Background color</label>
              <select id="qr-background">
                <option value="white">White</option>
                <option value="black">Black</option>
                <option value="brand">Accent color</option>
                <option value="transparent">Transparent</option>
              </select>
            </div>
          </div>
          <button type="button" id="copySignInLinkButton" class="signin-qr-url" aria-label="Copy sign-in link">
            <span>{{ sign_in_url }}</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
          </button>
          <div class="signin-qr-actions">
            <button type="button" class="sign-in-button" id="copyQrImageButton">Copy QR Code</button>
            <button type="button" class="sign-in-button" id="downloadQrImageButton">Download PNG</button>
            <button type="button" onclick="window.print()" class="sign-in-button">Print</button>
          </div>
          <p id="qr-image-status" role="status" aria-live="polite"></p>
        </div>
        <div class="signin-qr-figure">
          <div id="qr-preview" class="signin-qr-preview" data-brand-color="{{ settings.accent_color_hex }}">
            <div id="qr-source">{{ qr_svg }}</div>
            <canvas id="qr-canvas" hidden aria-label="Selected QR code preview"></canvas>
          </div>
          <div class="signin-qr-caption">{{ event.event_name }}</div>
        </div>
      </div>
    </div>
  </section>
</main>
<script src="{% static 'events/js/self_sign_in_qr.js' %}" defer></script>

<style>
.signin-qr-back { display: inline-flex; margin: 0.5rem 0 1.5rem; }

.signin-qr-card {
  display: flex;
  justify-content: center;
  width: fit-content;
  max-width: 100%;
  box-sizing: border-box;
  margin-left: auto;
  margin-right: auto;
}

.signin-qr-body {
  display: flex;
  flex-direction: column-reverse;
  gap: 3rem;
  align-items: center;
  justify-content: center;
}

.signin-qr-figure {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.25rem;
}

/* Keep the generated SVG crisp and scannable instead of letting it stretch. */
.signin-qr-preview {
  border-radius: 0.5rem;
  overflow: hidden;
  line-height: 0;
}
.signin-qr-figure svg,
.signin-qr-figure canvas {
  display: block;
  width: 320px;
  height: auto;
  max-width: 100%;
  image-rendering: pixelated;
}
.signin-qr-figure canvas {
  background: conic-gradient(#ddd 25%, #fff 0 50%, #ddd 0 75%, #fff 0) 0 0 / 20px 20px;
}
.signin-qr-figure svg { background: #fff; }
.signin-qr-colors { display: flex; gap: 0.75rem; }
.signin-qr-color { display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 0.25rem; }
.signin-qr-side select {
  appearance: auto;
  color: #222;
  background: #fff;
  border: 1px solid #767676;
  border-radius: 0.375rem;
  padding: 0.65rem;
  width: 100%;
  cursor: pointer;
}
#qr-image-status { margin: 0; min-height: 2.8em; line-height: 1.4; font-size: 0.875rem; color: #6b7280; }

.signin-qr-caption {
  font-weight: 600;
  font-size: 1.125rem;
}

.signin-qr-side {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  width: min(100%, 25rem);
}

.signin-qr-url {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  width: 100%;
  border: 0;
  border-radius: 0.5rem;
  cursor: pointer;
  text-align: left;
  color: inherit;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 0.875rem;
  word-break: break-all;
  background: rgba(127, 127, 127, 0.12);
  padding: 0.75rem;
}
.signin-qr-url span { min-width: 0; overflow-wrap: anywhere; }
.signin-qr-url svg { flex-shrink: 0; }
.signin-qr-url:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.signin-qr-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.5rem;
  align-items: flex-start;
}

@media print {
  @page { margin: 0.5in; }
  .signin-qr-back,
  main > section > .section-title,
  .signin-qr-side,
  header,
  nav,
  #djDebug {
    display: none !important;
  }
  .portal-body, .app, .main-container, .main-content, .signin-qr-card, .signin-qr-body {
    display: block;
    width: auto;
    max-width: none;
    min-height: 0;
    height: auto;
    margin: 0;
    padding: 0;
    box-shadow: none;
    background: white;
  }
  .signin-qr-figure { break-inside: avoid; }
  .signin-qr-figure svg, .signin-qr-figure canvas {
    width: 5in;
    max-width: 100%;
    height: auto;
  }
}
</style>
{% endblock %}
