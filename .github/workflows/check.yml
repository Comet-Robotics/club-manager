on:
  - push

name: Check

jobs:
  check:
    # services:
    #   postgres:
    #     image: postgres:15-alpine
    #     env:
    #       POSTGRES_PASSWORD: DB_PASSWORD
    #       POSTGRES_USER: DB_USERNAME
    #       POSTGRES_DB: DB_NAME
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5
    #     ports:
    #       - 5432:5432
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Installs the Python named by .python-version and the pipenv pinned in mise.toml, so CI
      # and the deploy hosts can't drift apart. Caches the tools it installs by default.
      - uses: jdx/mise-action@v4
      # Keyed on the lockfile: a dependency change rebuilds, anything else reuses the virtualenv.
      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: pipenv-${{ runner.os }}-${{ hashFiles('.python-version', 'Pipfile.lock') }}
      # --python for the same reason deploy/run.sh passes it: pipenv ignores PATH and falls back to
      # the interpreter it is itself running under, which is the one mise installed pipenv with.
      - name: Install dependencies
        run: pipenv install --dev --python "$(mise where python)/bin/python"
      - name: Create .env file
        run: cp .env.example .env
      - name: Run lint
        run: pipenv run ./scripts/lint.sh
      # Check if there are any outstanding Django migrations that need to be created
      # This command exits with code 1 if there are outstanding migrations
      # Note: Database connection warnings are expected and do not affect the check
      - name: Check for outstanding migrations
        run: pipenv run python manage.py makemigrations --check --dry-run
      # - name: Run tests
      #   run: pipenv run python manage.py test
