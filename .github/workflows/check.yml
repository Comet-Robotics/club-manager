on:
  - push

name: Check

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: pipenv-${{ runner.os }}-${{ hashFiles('.python-version', 'Pipfile.lock') }}
      - name: Install dependencies
        run: pipenv install --dev --python "$(mise where python)/bin/python"
      - name: Create .env file
        run: cp .env.example .env
      # The default .env runs the database on pgserver (an embedded PostgreSQL),
      # so no docker postgres service is needed. This must run before anything
      # that loads Django settings: importing settings starts pgserver when
      # DEV_PGDATA is set.
      - name: Set up pgserver database
        run: pipenv run python scripts/dev_setup.py --pgserver-only
      - name: Run lint and type checking
        run: pipenv run ./scripts/lint.sh
      # Check if there are any outstanding Django migrations that need to be created
      # This command exits with code 1 if there are outstanding migrations
      # Note: Database connection warnings are expected and do not affect the check
      - name: Check for outstanding migrations
        run: pipenv run python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: pipenv run python manage.py test
